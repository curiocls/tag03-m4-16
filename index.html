document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e780c808-d988-420b-b41f-88c1f362a970\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"16b693bd-b506-4b9b-9d63-544afb42aefd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4aead2a9-70c2-498c-8460-0469911636d2\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2fc05608-df86-4da0-9230-f29b9e5dc1ff\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"eb90c556-50b8-4f6e-80d4-c515b4ebe55e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"84554d2d-c8a2-4a5d-a147-d1e6b09f008e\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"72638000-2438-40fe-83ce-7efacf48ca9c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fa93acf5-629f-4de3-aa41-e4e69dc88ea7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"497384bc-7b4d-43aa-bd4d-198fa6b702c6\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"85e079c2-6b8a-4428-b364-c4672a3841fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"10523d79-9619-4a35-821c-4601ee97bfb0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Colour values transcribed verbatim from the TAFE Gippsland style guide\n   (0187_1121_TAFE Gippsland style guide_07), section 2.1.6 / 2.3 / 2.4.4 / 5.x. */\n:root{\n  /* ---- Primary palette: greens (PMS 3302 / 3415 / 3405 / 7488 / 366) ---- */\n  --green-3302:#004c46;\n  --green-3415:#00774c;\n  --green-3405:#00a769;\n  --green-7488:#7cc24d;\n  --green-366:#b8d87a;\n  /* Logo-sheet variant of PMS 3302 (section 2.1.6 quotes RGB 0,65,54) */\n  --green-logo:#004136;\n\n  /* ---- Neutrals ---- */\n  --warm-grey-1:#e4e1dc;   /* logo backgrounds, section 2.1.6 */\n  --warm-grey-2:#d7d2cb;   /* palette Warm Grey 1, section 2.3 */\n  --subtle-bg-light:#d3d2cd;\n  --subtle-bg-mid:#b8b6b0;\n  --ink:#121b21;           /* PMS 433 */\n  --white:#ffffff;\n\n  /* ---- Secondary palette: purple / magenta (2627, 526, 247, 239, 672) ---- */\n  --purple-2627:#3c1a52;\n  --purple-526:#742e89;\n  --magenta-247:#b43393;\n  --magenta-239:#e040af;\n  --pink-672:#e2a0c9;\n\n  /* ---- Secondary palette: red / orange / yellow (202, 207, 1655, 1495, 143) ---- */\n  --red-202:#8a2432;\n  --red-207:#ab0033;\n  --orange-1655:#ff4e00;\n  --orange-1495:#ff9016;\n  --yellow-143:#f6b436;\n\n  /* ---- Secondary palette: blues (2756, 2736, 285, 2995, 2985) ---- */\n  --blue-2756:#0f206c;\n  --blue-2736:#1226aa;\n  --blue-285:#0071ce;\n  --blue-2995:#00a8e2;\n  --blue-2985:#55c1e9;\n\n  /* ---- Sub brand palettes (sections 5.1, 5.2, 5.3) ---- */\n  --safetafe-green:#70d44b;\n  --safetafe-yellow:#f5b335;\n  --safetafe-black:#121b21;\n  --koorie-black:#121b21;\n  --koorie-red:#e82c2e;\n  --koorie-yellow:#f5b335;\n  --support-green-light:#70d44b;\n  --support-green-dark:#007f50;\n  --support-black:#121b21;\n\n  /* ---- Semantic aliases ---- */\n  --brand-primary:var(--green-3302);\n  --brand-accent:var(--magenta-247);\n  --text-heading:var(--green-3302);\n  --text-body:var(--ink);\n  --text-muted:#4d5a5f;\n  --text-on-dark:var(--white);\n  --text-caption:#5a6468;\n  --link:var(--green-3415);\n  --link-hover:var(--green-3302);\n  --surface-page:var(--white);\n  --surface-subtle:var(--warm-grey-1);\n  --surface-subtle-alt:var(--warm-grey-2);\n  --surface-dark:var(--green-3302);\n  --surface-accent:var(--magenta-247);\n  --rule:rgba(18,27,33,.4);        /* 0.5pt rules at -60% black, section 2.6 */\n  --rule-strong:rgba(18,27,33,.6);\n  --rule-on-dark:rgba(255,255,255,.35);\n  --button-bg:var(--green-3302);\n  --button-bg-hover:var(--green-3415);\n  --button-text:var(--white);\n\n  /* ---- Page turning device default pairings (section 2.4.3) ---- */\n  --turn-fold:var(--magenta-239);\n  --turn-shade:var(--purple-526);\n}\n<\u002Fstyle>\n<style>/* Type scale transcribed from section 2.6 \"Type paragraph styles\".\n   Print sizes are in points; px values are the 1pt = 1.333px screen equivalents.\n   Kerning \"optical -25\" ≈ -0.025em. */\n:root{\n  --font-display:\"Martel\",Georgia,\"Times New Roman\",serif;      /* stands in for Tiempos Text */\n  --font-body:\"Lato\",Arial,Helvetica,sans-serif;                 /* stands in for Graphik */\n  --font-display-print:\"Tiempos Text\",Georgia,serif;\n  --font-body-print:\"Graphik\",Arial,sans-serif;\n\n  --weight-display-regular:400; /* @kind other */\n  --weight-display-medium:600;\n  --weight-body-regular:400;\n  --weight-body-medium:600;\n  --weight-body-semibold:700;\n  --weight-body-bold:700;\n  --weight-body-black:900;\n\n  /* Heading_01 — 50pt / 50pt leading, tracking -25 */\n  --size-h1:66.7px; --leading-h1:1; /* @kind other */ --track-h1:-.025em; /* @kind other */\n  /* Heading_02 — 35pt / 36pt */\n  --size-h2:46.7px; --leading-h2:1.03; /* @kind other */ --track-h2:-.01em; /* @kind other */\n  /* Intro body — Graphik Medium 12pt / 14pt */\n  --size-intro:16px; --leading-intro:1.17; /* @kind other */ --track-intro:-.025em; /* @kind other */\n  /* Sub heading_01 — Graphik Black 17pt / 17pt */\n  --size-sub1:22.7px; --leading-sub1:1; /* @kind other */ --track-sub1:-.02em; /* @kind other */\n  /* Sub heading_02 — Graphik Black 12pt / 13pt */\n  --size-sub2:16px; --leading-sub2:1.08; /* @kind other */ --track-sub2:-.015em; /* @kind other */\n  /* Sub heading_03 — Graphik Semibold 10pt / 11pt */\n  --size-sub3:13.3px; --leading-sub3:1.1; /* @kind other */ --track-sub3:-.025em; /* @kind other */\n  /* Body — Graphik Regular 9.5pt / 12pt */\n  --size-body:12.7px; --leading-body:1.26; /* @kind other */ --track-body:-.025em; /* @kind other */\n  /* Testimonial — Tiempos Regular 14pt / 15pt */\n  --size-quote:18.7px; --leading-quote:1.07; /* @kind other */ --track-quote:-.025em; /* @kind other */\n  --size-quote-mark:48px;\n  /* Captions — Graphik Regular 8pt / 9pt */\n  --size-caption:10.7px; --leading-caption:1.12; /* @kind other */ --track-caption:-.025em; /* @kind other */\n\n  /* Screen-scale ladder for slides, banners and web-scale work */\n  --size-display-xl:120px;\n  --size-display-lg:88px;\n  --size-display-md:56px;\n  --size-screen-body:20px;\n  --size-screen-small:15px;\n}\n<\u002Fstyle>\n<style>/* Spacing derives from the print margin system, sections 4.3 / 4.4.\n   Millimetre tokens are authoritative for print; px tokens are for screen work. */\n:root{\n  --mm-3:3mm; /* @kind spacing */\n  --mm-5:5mm; /* @kind spacing */\n  --mm-7:7mm; /* @kind spacing */\n  --mm-10:10mm; /* @kind spacing */\n  --mm-13:13mm; /* @kind spacing */\n  --mm-15:15mm; /* @kind spacing */\n  --mm-18:18mm; /* @kind spacing */\n  --mm-70:70mm; /* @kind spacing */\n\n  /* DL literature, full bleed (4.3.0) */\n  --dl-bleed:3mm; /* @kind spacing */\n  --dl-margin-side:7mm; /* @kind spacing */\n  --dl-margin-top:10mm; /* @kind spacing */\n  /* DL literature, no bleed / internal printing (4.3.4) */\n  --dl-nobleed-margin:5mm; /* @kind spacing */\n  /* A4 literature, full bleed (4.4.0) */\n  --a4-bleed:3mm; /* @kind spacing */\n  --a4-margin-side:18mm; /* @kind spacing */\n  --a4-margin-top:18mm; /* @kind spacing */\n  /* cover copy band depth */\n  --a4-cover-band:70mm; /* @kind spacing */\n  /* A4 no bleed (4.4.4) */\n  --a4-nobleed-margin:5mm; /* @kind spacing */\n  --a4-nobleed-side:13mm; /* @kind spacing */\n\n  /* Paragraph space-after values from section 2.6 */\n  --space-after-h1:9mm; /* @kind spacing */\n  --space-after-h2:5mm; /* @kind spacing */\n  --space-after-intro:3mm; /* @kind spacing */\n  --space-after-body:3mm; /* @kind spacing */\n  --space-after-bullet:1mm; /* @kind spacing */\n\n  /* Screen scale */\n  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;\n  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;\n  --space-9:96px; --space-10:128px;\n\n  --measure-body:62ch; /* @kind other */\n  --measure-intro:46ch; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Borders, rules, radii, shadow and motion.\n   The brand is square-cornered and flat: the style guide shows no rounded cards,\n   no drop shadows and no gradients. Radius and shadow tokens exist only for\n   screen affordances (form fields, focus rings) and stay near zero. */\n:root{\n  --radius-none:0px;\n  --radius-input:2px;\n  --radius-max:0px;\n\n  /* table rules, section 2.6 */\n  --border-hairline:.5pt; /* @kind spacing */\n  --border-thin:1px; /* @kind spacing */\n  /* colour blocking / underline rules */\n  --border-thick:4px; /* @kind spacing */\n  --border-band:12px; /* @kind spacing */\n\n  --shadow-none:none;\n  --shadow-image-scrim:0 0 0 rgba(0,0,0,0);\n  --scrim-dark:linear-gradient(to top,rgba(0,65,54,.72),rgba(0,65,54,0) 62%); /* @kind other */\n  --scrim-flat:rgba(18,27,33,.45); /* @kind color */\n\n  --focus-ring:0 0 0 2px var(--white),0 0 0 4px var(--green-3405);\n\n  --ease-standard:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --duration-fast:120ms; /* @kind other */\n  --duration-base:200ms; /* @kind other */\n  --duration-slow:320ms; /* @kind other */\n\n  --opacity-hover:.85; /* @kind other */\n  --opacity-disabled:.4; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* TAFE Gippsland webfonts.\n   Print/licensed primaries are Tiempos Text (display) and Graphik (body copy) — not\n   redistributable, so not included here. The style guide's own sanctioned web\n   substitutes are the Google fonts used on tafegippsland.edu.au: Martel (display)\n   and Lato (body). Those are what this design system loads. See readme.md. */\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"13afd42e-28b7-4e8c-a77f-53127c242681\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e26ad487-1b79-4c9f-b4ab-b1439c60b835\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"da5a1d8e-e5a0-4f04-81b2-69da60d480e2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1e18f0f6-6da3-4b51-91ec-702006ae7a31\") format('woff2');\n  unicode-range: U+0000-00FF, U+01 nagari */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"84554d2d-c8a2-4a5d-a147-d1e6b09f008e\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"72638000-2438-40fe-83ce-7efacf48ca9c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fa93acf5-629f-4de3-aa41-e4e69dc88ea7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"497384bc-7b4d-43aa-bd4d-198fa6b702c6\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"85e079c2-6b8a-4428-b364-c4672a3841fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martel';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"10523d79-9619-4a35-821c-4601ee97bfb0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Colour values transcribed verbatim from the TAFE Gippsland style guide\n   (0187_1121_TAFE Gippsland style guide_07), section 2.1.6 / 2.3 / 2.4.4 / 5.x. */\n:root{\n  /* ---- Primary palette: greens (PMS 3302 / 3415 / 3405 / 7488 / 366) ---- */\n  --green-3302:#004c46;\n  --green-3415:#00774c;\n  --green-3405:#00a769;\n  --green-7488:#7cc24d;\n  --green-366:#b8d87a;\n  /* Logo-sheet variant of PMS 3302 (section 2.1.6 quotes RGB 0,65,54) */\n  --green-logo:#004136;\n\n  /* ---- Neutrals ---- */\n  --warm-grey-1:#e4e1dc;   /* logo backgrounds, section 2.1.6 */\n  --warm-grey-2:#d7d2cb;   /* palette Warm Grey 1, section 2.3 */\n  --subtle-bg-light:#d3d2cd;\n  --subtle-bg-mid:#b8b6b0;\n  --ink:#121b21;           /* PMS 433 */\n  --white:#ffffff;\n\n  /* ---- Secondary palette: purple / magenta (2627, 526, 247, 239, 672) ---- */\n  --purple-2627:#3c1a52;\n  --purple-526:#742e89;\n  --magenta-247:#b43393;\n  --magenta-239:#e040af;\n  --pink-672:#e2a0c9;\n\n  /* ---- Secondary palette: red / orange / yellow (202, 207, 1655, 1495, 143) ---- */\n  --red-202:#8a2432;\n  --red-207:#ab0033;\n  --orange-1655:#ff4e00;\n  --orange-1495:#ff9016;\n  --yellow-143:#f6b436;\n\n  /* ---- Secondary palette: blues (2756, 2736, 285, 2995, 2985) ---- */\n  --blue-2756:#0f206c;\n  --blue-2736:#1226aa;\n  --blue-285:#0071ce;\n  --blue-2995:#00a8e2;\n  --blue-2985:#55c1e9;\n\n  /* ---- Sub brand palettes (sections 5.1, 5.2, 5.3) ---- */\n  --safetafe-green:#70d44b;\n  --safetafe-yellow:#f5b335;\n  --safetafe-black:#121b21;\n  --koorie-black:#121b21;\n  --koorie-red:#e82c2e;\n  --koorie-yellow:#f5b335;\n  --support-green-light:#70d44b;\n  --support-green-dark:#007f50;\n  --support-black:#121b21;\n\n  /* ---- Semantic aliases ---- */\n  --brand-primary:var(--green-3302);\n  --brand-accent:var(--magenta-247);\n  --text-heading:var(--green-3302);\n  --text-body:var(--ink);\n  --text-muted:#4d5a5f;\n  --text-on-dark:var(--white);\n  --text-caption:#5a6468;\n  --link:var(--green-3415);\n  --link-hover:var(--green-3302);\n  --surface-page:var(--white);\n  --surface-subtle:var(--warm-grey-1);\n  --surface-subtle-alt:var(--warm-grey-2);\n  --surface-dark:var(--green-3302);\n  --surface-accent:var(--magenta-247);\n  --rule:rgba(18,27,33,.4);        /* 0.5pt rules at -60% black, section 2.6 */\n  --rule-strong:rgba(18,27,33,.6);\n  --rule-on-dark:rgba(255,255,255,.35);\n  --button-bg:var(--green-3302);\n  --button-bg-hover:var(--green-3415);\n  --button-text:var(--white);\n\n  /* ---- Page turning device default pairings (section 2.4.3) ---- */\n  --turn-fold:var(--magenta-239);\n  --turn-shade:var(--purple-526);\n}\n\n/* Type scale transcribed from section 2.6 \"Type paragraph styles\".\n   Print sizes are in points; px values are the 1pt = 1.333px screen equivalents.\n   Kerning \"optical -25\" ≈ -0.025em. */\n:root{\n  --font-display:\"Martel\",Georgia,\"Times New Roman\",serif;      /* stands in for Tiempos Text */\n  --font-body:\"Lato\",Arial,Helvetica,sans-serif;                 /* stands in for Graphik */\n  --font-display-print:\"Tiempos Text\",Georgia,serif;\n  --font-body-print:\"Graphik\",Arial,sans-serif;\n\n  --weight-display-regular:400; /* @kind other */\n  --weight-display-medium:600;\n  --weight-body-regular:400;\n  --weight-body-medium:600;\n  --weight-body-semibold:700;\n  --weight-body-bold:700;\n  --weight-body-black:900;\n\n  /* Heading_01 — 50pt / 50pt leading, tracking -25 */\n  --size-h1:66.7px; --leading-h1:1; /* @kind other */ --track-h1:-.025em; /* @kind other */\n  /* Heading_02 — 35pt / 36pt */\n  --size-h2:46.7px; --leading-h2:1.03; /* @kind other */ --track-h2:-.01em; /* @kind other */\n  /* Intro body — Graphik Medium 12pt / 14pt */\n  --size-intro:16px; --leading-intro:1.17; /* @kind other */ --track-intro:-.025em; /* @kind other */\n  /* Sub heading_01 — Graphik Black 17pt / 17pt */\n  --size-sub1:22.7px; --leading-sub1:1; /* @kind other */ --track-sub1:-.02em; /* @kind other */\n  /* Sub heading_02 — Graphik Black 12pt / 13pt */\n  --size-sub2:16px; --leading-sub2:1.08; /* @kind other */ --track-sub2:-.015em; /* @kind other */\n  /* Sub heading_03 — Graphik Semibold 10pt / 11pt */\n  --size-sub3:13.3px; --leading-sub3:1.1; /* @kind other */ --track-sub3:-.025em; /* @kind other */\n  /* Body — Graphik Regular 9.5pt / 12pt */\n  --size-body:12.7px; --leading-body:1.26; /* @kind other */ --track-body:-.025em; /* @kind other */\n  /* Testimonial — Tiempos Regular 14pt / 15pt */\n  --size-quote:18.7px; --leading-quote:1.07; /* @kind other */ --track-quote:-.025em; /* @kind other */\n  --size-quote-mark:48px;\n  /* Captions — Graphik Regular 8pt / 9pt */\n  --size-caption:10.7px; --leading-caption:1.12; /* @kind other */ --track-caption:-.025em; /* @kind other */\n\n  /* Screen-scale ladder for slides, banners and web-scale work */\n  --size-display-xl:120px;\n  --size-display-lg:88px;\n  --size-display-md:56px;\n  --size-screen-body:20px;\n  --size-screen-small:15px;\n}\n\n/* Spacing derives from the print margin system, sections 4.3 / 4.4.\n   Millimetre tokens are authoritative for print; px tokens are for screen work. */\n:root{\n  --mm-3:3mm; /* @kind spacing */\n  --mm-5:5mm; /* @kind spacing */\n  --mm-7:7mm; /* @kind spacing */\n  --mm-10:10mm; /* @kind spacing */\n  --mm-13:13mm; /* @kind spacing */\n  --mm-15:15mm; /* @kind spacing */\n  --mm-18:18mm; /* @kind spacing */\n  --mm-70:70mm; /* @kind spacing */\n\n  /* DL literature, full bleed (4.3.0) */\n  --dl-bleed:3mm; /* @kind spacing */\n  --dl-margin-side:7mm; /* @kind spacing */\n  --dl-margin-top:10mm; /* @kind spacing */\n  /* DL literature, no bleed / internal printing (4.3.4) */\n  --dl-nobleed-margin:5mm; /* @kind spacing */\n  /* A4 literature, full bleed (4.4.0) */\n  --a4-bleed ty-hover:.85; /* @kind other */\n  --opacity-disabled:.4; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"2a2f3a97-a7e6-452b-94fa-51078f5247c6\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--font-body, Lato, Arial, sans-serif); -webkit-font-smoothing: antialiased; }\n  a { color: var(--link); } a:hover { color: var(--link-hover); }\n  path, circle, rect, g, polygon, line { transition: d 320ms ease, cx 320ms ease, cy 320ms ease, opacity 240ms ease; }\n  @media screen { .plan-print { display: none !important; } }\n  @media print {\n    .plan-app { display: none !important; }\n    .plan-print { display: block !important; }\n    @page { margin: 16mm; }\n    body { background: #fff; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ notStarted }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 50; overflow: hidden; background: #003c37; font-family: var(--font-body, Lato, Arial, sans-serif);\">\n    <div style=\"position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,60,55,.62) 44%, rgba(0,60,55,.34) 66%, rgba(0,60,55,0) 94%);\"><\u002Fdiv>\n    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: clamp(280px, 54%, 600px); background: #004c46; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 34px clamp(22px, 4vw, 46px); box-shadow: 26px 0 62px rgba(0,44,40,.44); overflow: hidden;\">\n      <div style=\"position: absolute; right: 0; bottom: 0; width: min(74%, 330px); height: min(58%, 290px); pointer-events: none; overflow: hidden;\">\n        <span style=\"position: absolute; inset: 0; background: #00774c; clip-path: polygon(100% 14%, 100% 100%, 60% 100%);\"><\u002Fspan>\n        <span style=\"position: absolute; inset: 0; background: #003c2e; clip-path: polygon(39% 54%, 70% 35%, 60% 100%);\"><\u002Fspan>\n        <span style=\"position: absolute; inset: 0; background: #7cc24d; clip-path: polygon(47% 42%, 100% 14%, 60% 100%);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position: relative; z-index: 1; display: flex; flex-direction: column;\">\n        <p style=\"display: flex; align-items: center; gap: 8px; margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;\"><span style=\"width: 7px; height: 7px; border-radius: 50%; background: #b8d87a; flex: none;\"><\u002Fspan>Customer service for home electrification<\u002Fp>\n        <h2 style=\"font-family: var(--font-display, Georgia, serif); font-weight: 400; font-size: clamp(26px, 3.9vw, 42px); line-height: 1.1; letter-spacing: -0.025em; margin: 16px 0 0; color: #fff;\">Plan a home's electrification pathway<\u002Fh2>\n        <p style=\"font-size: clamp(13.5px, 1.4vw, 16px); line-height: 1.55; color: #deeadf; max-width: 42ch; margin: 14px 0 0;\">Build a ten-year electrification plan for a household, adding technologies year by year to see how the bill, carbon, self-generated power and gas use change over time.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ startNow }}\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 9px; min-height: 48px; margin-top: 26px; padding: 12px 22px; border-radius: 999px; border: 1px solid #b8d87a; background: #7cc24d; color: #00352f; font-size: 16px; font-weight: 600; line-height: 1.2; box-shadow: 0 10px 26px rgba(0,44,40,.34); transition: background .2s ease, transform .2s ease;\" style-hover=\"background: #b8d87a; transform: translateY(-1px);\">\n          Start exploring\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"position: absolute; left: clamp(22px, 4vw, 46px); bottom: ack-body); color: var(--ink);\">{{ info.desc }}<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 3px; background: var(--warm-grey-1); border-radius: 12px; padding: 12px 14px;\">\n        <span style=\"font-family: var(--font-body); font-size: var(--size-caption); letter-spacing: 0.08em; text-transform: uppercase; font-weight: var(--weight-body-black); color: {{ info.accent }};\">Common misconception<\u002Fspan>\n        <p style=\"margin: 0; font-family: var(--font-body); font-size: var(--size-body); line-height: 1.5; letter-spacing: var(--track-body); color: var(--ink);\">{{ info.myth }}<\u002Fp>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ closeInfo }}\" style=\"align-self: flex-end; margin-top: 2px; padding: 9px 20px; border-radius: 999px; border: none; background: var(--green-3302); color: var(--white); font-family: var(--font-body); font-size: var(--size-body); font-weight: var(--weight-body-black); cursor: pointer;\">Exit<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"plan-app\" style=\"min-height: 100vh; background: var(--white); color: var(--ink); display: flex; flex-direction: column;\">\n\n  <header style=\"padding: 10px 40px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 0;\">\n      <x-import component-from-global-scope=\"TAFEGippsland_cdfa85.SubHeading\" level=\"3\" hint-size=\"auto,14px\" style=\"letter-spacing: 0.08em; text-transform: uppercase; color: var(--green-3415);\">Customer service for home electrification<\u002Fx-import>\n      <x-import component-from-global-scope=\"TAFEGippsland_cdfa85.Heading\" level=\"4\" medium=\"{{ true }}\" as=\"h1\" hint-size=\"auto,28px\" style=\"color: var(--green-3302); margin: 0;\">Plan a home's electrification pathway<\u002Fx-import>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ exportPlan }}\" style=\"flex: ding: 4px 11px; border-radius: 999px;\">{{ pi.name }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ planSummary.noSteps }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin: 10px 0 22px; font-size: 14px; color: #4d5a5f;\">No technologies have been added to this plan yet.<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4d5a5f; border-top: 2px solid #004c46; padding-top: 10px;\">Outcomes by year 10 — indicative only<\u002Fdiv>\n  <div style=\"display: flex; gap: 40px; margin: 12px 0 22px;\">\n    <div><div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #4d5a5f;\">Yearly bill saved<\u002Fdiv><div style=\"font-family: var(--font-display, Georgia, serif); font-size: 30px; color: #00774c;\">{{ planSummary.billPct }}<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #4d5a5f;\">Emissions cut<\u002Fdiv><div style=\"font-family: var(--font-display, Georgia, serif); font-size: 30px; color: #16455D;\">{{ planSummary.carbonPct }}<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #4d5a5f;\">Energy self-supplied<\u002Fdiv><div style=\"font-family: var(--font-display, Georgia, serif); font-size: 30px; color: #E0A200;\">{{ planSummary.powerPct }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size: 12px; line-height: 1.5; color: #6b7378; border-top: 1px solid #e4e0d9; padding-top: 10px; max-width: 60ch;\">Costs, savings and percentages in this plan are indicative placeholders for practice only. They are not quotes and do not account for rebates, household size or energy use.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;chartStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;area&quot;,&quot;line&quot;],&quot;default&quot;:&quot;area&quot;,&quot;tsType&quot;:&quot;'area' | 'line'&quot;},&quot;investColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#0071ce&quot;,&quot;#3c1a52&quot;,&quot;#121b21&quot;],&quot;default&quot;:&quot;#0071ce&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;savingsColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#00a769&quot;,&quot;#ff9016&quot;,&quot;#ff4e00&quot;],&quot;default&quot;:&quot;#00a769&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst MAXY = 10;\nconst YEARS_ALL = Array.from({ length: MAXY + 1 }, (_, i) => i);\nconst BASE_BILL = 4800;   // indicative annual energy bill for a gas + grid home ($/yr)\nconst BASE_CO2 = 10;      // indicative household energy emissions (tonnes CO2/yr)\n// Indicative placeholder data only. cost = up-front $, save = $/yr off bills,\n// co2 = tonnes/yr avoided, indep = self-supply % points, elec = off-gas % points.\nconst TECHS = [\n  { id: \"solar\", name: \"Solar panels\", cost: 7500, save: 1150, co2: 3.0, indep: 35, elec: 0,\n    desc: \"Panels on the roof turn daylight into electricity the home uses first, so less is bought from the grid. They cut both bills and emissions from day one.\",\n    myth: \"People often think solar only works in constant sun — panels still generate useful power on cloudy days and through winter.\" },\n  { id: \"battery\", name: \"Home battery\", cost: 11000, save: 700, co2: 0.5, indep: 30, elec: 0,\n    desc: \"A battery stores the solar power a home makes in the day so it can be used at night. That lifts how much of your own energy you rely on.\",\n    myth: \"A battery is not a blackout cure-all — many are sized to shift daily use, not to run the whole house for days.\" },\n  { id: \"hotwater\", name: \"Hot water heat pump\", cost: 3800, save: 520, co2: 1.2, indep: 0, elec: 16,\n    desc: \"A heat-pump hot water system moves heat from the air into the tank, using far less energy than gas or old electric units. It's one of the cheapest swaps to make.\",\n    myth: \"They're not just an electric element in disguise — they use roughly a third of the energy of a conventional electric tank.\" },\n  { id: \"heatpump\", name: \"Heat pump heating\", cost: 5500, save: 780, co2: 1.5, indep: 0, elec: 22,\n    desc: \"Reverse-cycle heat pumps heat and cool the home efficiently by moving heat rather than burning fuel. They replace gas heaters and cut running costs.\",\n    myth: \"People assume they struggle in the cold — modern units keep working efficiently well below zero.\" },\n  { id: \"ac\", name: \"Split system cooling\", cost: 3400, save: 210, co2: 0.3, indep: 0, elec: 10,\n    desc: \"A split system cools rooms in summer and can heat them too, all on electricity. Sizing it to the room keeps running costs low.\",\n    myth: \"Bigger isn't better — an oversized unit cycles on and off, costing more and cooling less evenly.\" },\n  { id: \"cooktop\", name: \"Induction cooktop\", cost: 2800, save: 260, co2: 0.6, indep: 0, elec: 12,\n    desc: \"Induction cooktops heat the pan directly with a magnetic field, so they're fast, precise and easy to clean. They remove gas flames from the kitchen.\",\n    myth: \"Chefs worry about losing control — induction responds faster than gas and holds a steady low simmer.\" },\n  { id: \"dryer\", name: \"Heat pump dryer\", cost: 1600, save: 140, co2: 0.2, indep: 0, elec: 8,\n    desc: \"A heat-pump dryer recycles warm air instead of venting it, using a fraction of the energy of a vented dryer. It plugs into a normal power point.\",\n    myth: \"They're not painfully slow — cycles take a little longer but use far less power for the same dry load.\" },\n  { id: \"ev\", name: \"EV charger\", cost: 1800, save: 420, co2: 1.8, indep: 0, elec: 10,\n    desc: \"A home charger tops up an electric car overnight, ideally from daytime solar. It replaces petrol spend with much cheaper electricity.\",\n    myth: \"You don't need to charge to 100% every night — most drivers top up a little and daily range is rarely an issue.\" },\n  { id: \"switchboard\", name: \"Switchboard upgrade\", cost: 2200, save: 0, co2: 0, indep: 0, elec: 0,\n    desc: \"An older switchboard may need upgrading so it can safely run new appliances, solar and a charger. It's an enabler rather than a saving on its own.\",\n    myth: \"It's not always required — many homes only need it once several big electric loads are added.\" },\n  { id: \"gasoff\", name: \"Disconnect the gas\", cost: 900, save: 340, co2: 0.8, indep: 0, elec: 22,\n    desc: \"Once nothing in the home runs on gas, disconnecting removes the fixed daily supply charge for good. It's the final step of going all-electric.\",\n    myth: \"Do it last, not first — disconnecting before replacing gas appliances leaves the home without heating or hot water.\" }\n];\nconst VIEWS = [\n  { id: \"money\", label: \"Lower bills\", title: \"Share of the yearly bill saved\", color: \"#00774c\" },\n  { id: \"carbon\", label: \"Cut carbon\", title: \"Share of home emissions cut\", color: \"#16455D\" },\n  { id: \"indep\", label: \"Own power\", title: \"Share of energy self-supplied\", color: \"#E0A200\" }\n];\n\nclass Component extends DCLogic {\n  state = { year: 0, byYear: {}, view: \"money\", dragging: false, started: false, infoId: null };\n\n  techById(id) { return TECHS.find(t => t.id === id); }\n  atYear(y) { return this.state.byYear[y] || []; }\n\n  yearOf(id) {\n    const b = this.state.byYear;\n    for (const k in b) { if (b[k].indexOf(id) !== -1) return +k; }\n    return -1;\n  }\n\n  sumF(y, f) {\n    let n = 0;\n    for (let s = 0; s <= y; s++) this.atYear(s).forEach(id => { n += this.techById(id)[f] || 0; });\n    return n;\n  }\n\n  seriesAt(y) {\n    let invest = 0, saved = 0;\n    for (let s = 0; s <= y; s++) this.atYear(s).forEach(id => {\n      const t = this.techById(id);\n      invest += t.cost;\n      saved += t.save * (y - s);\n    });\n    return { invest, saved };\n  }\n\n  metricPct(y, view) {\n    if (view === \"money\") return Math.min(100, (this.sumF(y, \"save\") / BASE_BILL) * 100);\n    if (view === \"carbon\") return Math.min(100, (this.sumF(y, \"co2\") / BASE_CO2) * 100);\n    if (view === \"indep\") return Math.min(100, this.sumF(y, \"indep\"));\n    return 0;\n  }\n\n  costBand(c) {\n    return c <= 1500 ? \"Low cost\" : c <= 4000 ? \"Medium cost\" : c <= 8000 ? \"High cost\" : \"Very high cost\";\n  }\n  yearLabel(y, cap) { return y === 0 ? (cap ? \"Now\" : \"now\") : \"year \" + y; }\n  anchor(y) {\n    if (y === 0) return { tx: \"translateX(0)\", ta: \"left\" };\n    if (y === MAXY) return { tx: \"translateX(-100%)\", ta: \"right\" };\n    return { tx: \"translateX(-50%)\", ta: \"center\" };\n  }\n\n  setYearFromEvent(e, el) {\n    const r = el.getBoundingClientRect();\n    const y = Math.max(0, Math.min(MAXY, Math.round(((e.clientX - r.left) / r.width) * MAXY)));\n    if (y !== this.state.year) this.setState({ year: y });\n  }\n\n  renderVals() {\n    const { year, byYear, view } = this.state;\n    const savingsColor = this.props.savingsColor ?? \"#00a769\";\n    const areaOpacity = (this.props.chartStyle ?? \"area\") === \"area\" ? 0.12 : 0;\n\n    const X = y => 62 + (y / MAXY) * (544 - 62);\n    const yMax = 100;\n    const Y = v => 248 - (v / yMax) * (248 - 24);\n\n    const vals = YEARS_ALL.map(y => this.metricPct(y, view));\n    const viewDef = VIEWS.find(v => v.id === view) || VIEWS[0];\n    const color = viewDef.color;\n    const mkLine = vals.map((v, i) => (i ? \"L\" : \"M\") + X(i).toFixed(1) + \" \" + Y(v).toFixed(1)).join(\" \");\n    const mkArea = mkLine + \" L\" + X(MAXY).toFixed(1) + \" 248 L\" + X(0).toFixed(1) + \" 248 Z\";\n    const paths = [{ lineD: mkLine, areaD: mkArea, color }];\n    const dots = vals.map((v, i) => ({ x: X(i), y: Y(v), r: i === year ? 7 : 4, fill: color }));\n    const gridLines = [0, 25, 50, 75, 100].map(v => ({ y: Y(v).toFixed(1), label: v + \"%\" }));\n    const now = Math.round(this.metricPct(year, view));\n    let legend, figs;\n    if (view === \"money\") {\n      legend = [{ color, label: \"Bill saved\" }];\n      figs = [{ label: \"Yearly bill saved\", value: now + \"%\", color }, { label: \"Bill still to pay\", value: (100 - now) + \"%\", color }];\n    } else if (view === \"carbon\") {\n      legend = [{ color, label: \"Emissions cut\" }];\n      figs = [{ label: \"Emissions cut\", value: now + \"%\", color }, { label: \"Still emitting\", value: (100 - now) + \"%\", color }];\n    } else {\n      legend = [{ color, label: \"Self-supplied\" }];\n      figs = [{ label: \"You make yourself\", value: now + \"%\", color }, { label: \"Still from the grid\", value: (100 - now) + \"%\", color }];\n    }\n\n    const counts = YEARS_ALL.map(y => this.atYear(y).length);\n    const maxCount = Math.max(0, ...counts);\n    const trackHeight = (maxCount > 0 ? 70 + maxCount * 20 : 74) + \"px\";\n    const ticks = YEARS_ALL.map(y => ({ left: (y / MAXY) * 100 + \"%\" }));\n    const nodes = YEARS_ALL.filter(y => counts[y] > 0 || y === year).map(y => {\n      const active = y === year, a = this.anchor(y);\n      return { left: (y / MAXY) * 100 + \"%\", tx: a.tx, ta: a.ta, labelText: this.yearLabel(y, true), labelColor: active ? \"#004c46\" : \"#4d5a5f\", labelWeight: active ? 700 : 500, dotSize: active ? \"18px\" : \"12px\", dotFill: counts[y] > 0 ? \"#004c46\" : \"#ffffff\", dotBorder: active ? \"#004c46\" : \"#4d5a5f\" };\n    });\n    const lists = YEARS_ALL.filter(y => counts[y] > 0).map(y => {\n      const a = this.anchor(y);\n      return { left: (y / MAXY) * 100 + \"%\", tx: a.tx, ta: a.ta, width: y === 0 || y === MAXY ? \"128px\" : \"116px\", items: this.atYear(y).map(id => ({ name: this.techById(id).name })) };\n    });\n\n    const options = TECHS.map(t => {\n      const usedAt = this.yearOf(t.id);\n      const selected = usedAt === year;\n      const disabled = usedAt !== -1 && usedAt !== year;\n      return {\n        name: t.name,\n        meta: usedAt !== -1 && usedAt !== year\n          ? \"Added \" + this.yearLabel(usedAt, false)\n          : t.save === 0\n            ? this.costBand(t.cost) + \" up front · enables other steps\"\n            : this.costBand(t.cost) + \" up front · saves ≈ \" + Math.round((t.save / BASE_BILL) * 100) + \"% off the bill\",\n        bg: selected ? \"#004c46\" : \"#ffffff\", fg: selected ? \"#ffffff\" : \"#121b21\",\n        metaColor: selected ? \"rgba(255,255,255,0.8)\" : \"#4d5a5f\",\n        borderColor: selected ? \"#004c46\" : \"rgba(18,27,33,0.4)\",\n        cursor: disabled ? \"not-allowed\" : \"pointer\", opacity: disabled ? 0.4 : 1, disabled,\n        infoColor: selected ? \"rgba(255,255,255,0.85)\" : \"#4d5a5f\",\n        onInfo: () => this.setState({ infoId: t.id }),\n        onClick: () => {\n          if (disabled) return;\n          const next = Object.assign({}, byYear);\n          const arr = (next[year] || []).slice();\n          next[year] = selected ? arr.filter(x => x !== t.id) : arr.concat([t.id]);\n          this.setState({ byYear: next });\n        }\n      };\n    });\n\n    const installedList = [];\n    for (let y = 0; y <= year; y++) this.atYear(y).forEach(id => installedList.push({ name: this.techById(id).name }));\n    const on = id => { const u = this.yearOf(id); return u !== -1 && u <= year ? 1 : 0; };\n    const pickedHere = counts[year];\n    const labelSet = Array.from(new Set([0, 2, 4, 6, 8, 10, year])).sort((a, b) => a - b);\n\n    const infoTech = this.techById(this.state.infoId);\n    const infoAccent = (VIEWS.find(v => v.id === view) || VIEWS[0]).color;\n\n    const planYears = YEARS_ALL.filter(y => this.atYear(y).length > 0).map(y => ({\n      label: this.yearLabel(y, true),\n      items: this.atYear(y).map(id => ({ name: this.techById(id).name }))\n    }));\n\n    return {\n      exportPlan: () => { try { window.print(); } catch (e) {} },\n      planSummary: {\n        anySteps: planYears.length > 0,\n        noSteps: planYears.length === 0,\n        years: planYears,\n        billPct: Math.round(this.metricPct(MAXY, \"money\")) + \"%\",\n        carbonPct: Math.round(this.metricPct(MAXY, \"carbon\")) + \"%\",\n        powerPct: Math.round(this.metricPct(MAXY, \"indep\")) + \"%\"\n      },\n      info: infoTech ? { name: infoTech.name, desc: infoTech.desc, myth: infoTech.myth, accent: infoAccent } : null,\n      closeInfo: () => this.setState({ infoId: null }),\n      stop: e => { e.stopPropagation(); },\n      notStarted: !this.state.started,\n      startNow: () => this.setState({ started: true }),\n      trackHeight, ticks, nodes, lists, options,\n      paths, dots, gridLines, legend, figs, areaOpacity,\n      metricColor: color,\n      chartTitle: viewDef.title,\n      metricTabs: VIEWS.map(v => ({\n        label: v.label, active: v.id === view,\n        bg: v.id === view ? v.color : \"#ffffff\", fg: v.id === view ? \"#ffffff\" : \"#121b21\",\n        border: v.id === view ? v.color : \"rgba(18,27,33,0.4)\",\n        onClick: () => this.setState({ view: v.id })\n      })),\n      cursorX: X(year).toFixed(1),\n      xLabels: labelSet.map(y => ({ svgx: X(y).toFixed(1), label: y === 0 ? \"Now\" : \"Yr \" + y, weight: y === year ? 700 : 400, fill: y === year ? \"#004c46\" : \"#4d5a5f\" })),\n      playheadLeft: (year / MAXY) * 100 + \"%\",\n      progressWidth: (year / MAXY) * 100 + \"%\",\n      houseStageLabel: \"at \" + this.yearLabel(year, false),\n      installedList,\n      installedCountLabel: installedList.length === 0 ? \"nothing done yet\" : installedList.length === 1 ? \"one step done\" : installedList.length + \" steps done\",\n      stageCountLabel: pickedHere === 0\n        ? \"Nothing added \" + this.yearLabel(year, false) + \" yet.\"\n        : pickedHere + (pickedHere === 1 ? \" step added \" : \" steps added \") + this.yearLabel(year, false) + \".\",\n      pickerTitle: year === 0 ? \"What goes in now?\" : \"What goes in at year \" + year + \"?\",\n      pickerHint: \"Add as many as you like. Tap again to remove, or scrub to another year to change it.\",\n      solarOn: on(\"solar\"), batteryOn: on(\"battery\"), heatPumpOn: on(\"heatpump\"), hotWaterOn: on(\"hotwater\"),\n      acOn: on(\"ac\"), evOn: on(\"ev\"), cooktopOn: on(\"cooktop\"), dryerOn: on(\"dryer\"),\n      switchboardOn: on(\"switchboard\"), gasOffOn: on(\"gasoff\"),\n      onTrackDown: e => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} this.setState({ dragging: true }); this.setYearFromEvent(e, e.currentTarget); },\n      onTrackMove: e => { if (this.state.dragging) this.setYearFromEvent(e, e.currentTarget); },\n      onTrackUp: e => { try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {} this.setState({ dragging: false }); },\n      onTrackKey: e => {\n        if (e.key === \"ArrowRight\" || e.key === \"ArrowUp\") { e.preventDefault(); this.setState({ year: Math.min(MAXY, year + 1) }); }\n        if (e.key === \"ArrowLeft\" || e.key === \"ArrowDown\") { e.preventDefault(); this.setState({ year: Math.max(0, year - 1) }); }\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
